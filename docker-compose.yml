services:
  mysql:
    image: mysql/mysql-server:latest
    container_name: mysql
    restart: always
    environment:
      - MYSQL_DATABASE=flash_sale_DB
      - MYSQL_ROOT_PASSWORD=flash_sale_PW
      - MYSQL_ROOT_HOST=%
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - flash_sale
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 10s
      retries: 10

  api:
    build: .
    container_name: flashsale_api
    ports:
      - "80:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/flash_sale_DB
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=flash_sale_PW
      - MERCADO_PAGO_ACCESS_TOKEN=${MERCADO_PAGO_ACCESS_TOKEN}
      - MERCADO_PAGO_SECRET_SIGNATURE=${MERCADO_PAGO_SECRET_SIGNATURE}
      - MAILTRAP_TOKEN=${MAILTRAP_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - flash_sale

volumes:
  mysql_data:
    name: mysql_data

networks:
  flash_sale:
    driver: bridge
    name: flash_sale-network
