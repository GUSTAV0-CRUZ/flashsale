services:
  mysql:
    image: mysql/mysql-server:latest
    container_name: mysql
    restart: always
    environment:
      - MYSQL_DATABASE=flash_sale_DB
      - MYSQL_ROOT_PASSWORD=flash_sale_PW
      - MYSQL_ROOT_HOST=%
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    name: mysql_data

networks:
  flash_sale:
    driver: bridge
    name: flash_sale-network
