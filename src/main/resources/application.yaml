spring:
  profiles:
    active: dev
  application:
    name: FlashSale

  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale_DB
    username: root
    password: flash_sale_PW

  jpa:
    hibernate:
      ddl-auto: update
#    show-sql: true
    properties:
      hibernate:
        format_sql: true

payment:
  mercado_pago:
    access_token: ${MERCADO_PAGO_ACCESS_TOKEN}
    secret_signature: ${MERCADO_PAGO_SECRET_SIGNATURE}
