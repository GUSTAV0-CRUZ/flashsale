spring:
  threads:
    virtual:
      enabled: true
  cache:
    caffeine:
      spec:
        maximumSize: 1000
        expireAfterWrite: 1d
  profiles:
    active: dev
  application:
    name: FlashSale

  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale_DB
    username: root
    password: flash_sale_PW

  jpa:
    hibernate:
      ddl-auto: update
#    show-sql: true
    properties:
      hibernate:
        format_sql: true

payment:
  mercado_pago:
    access_token: ${MERCADO_PAGO_ACCESS_TOKEN}
    secret_signature: ${MERCADO_PAGO_SECRET_SIGNATURE}

notification:
  mailtrap:
    sender_email: ${MAILTRAP_SENDER_EMAIL:hello@demomailtrap.co}
    token: ${MAILTRAP_TOKEN}

springdoc:
  paths-to-exclude: /order/webHook/**
  swagger-ui:
    url: /openapi.yaml
